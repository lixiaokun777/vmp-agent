name: 发布 Agent 安装包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true

      - name: 运行测试
        run: go test -race -count=1 ./...

      - name: 静态检查
        run: go vet ./...
      - name: 已知漏洞检查
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: 构建安装包
        run: ./scripts/build-agent-bundle.sh

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/vmlease-agent-linux-*.tar.gz dist/SHA256SUMS --generate-notes
